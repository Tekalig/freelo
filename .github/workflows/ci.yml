name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freelo_test
          POSTGRES_PASSWORD: freelo_test
          POSTGRES_DB: freelo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freelo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: freelo_test
      DB_PASSWORD: freelo_test
      DB_NAME: freelo_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      SESSION_SECRET: test-session-secret
      GOOGLE_CLIENT_ID: test
      GITHUB_CLIENT_ID: test
      GITHUB_CLIENT_SECRET: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      MAIL_HOST: localhost
      MAIL_USER: test
      MAIL_PASSWORD: test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Build Docker image
        run: docker build -t freelo:${{ github.sha }} .
